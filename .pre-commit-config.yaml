# Hooks run on every `git commit`. Install once per clone with:
#   pre-commit install
# Run against every file with:
#   pre-commit run --all-files
#
# Hook revisions are pinned to full commit SHAs, like the CI actions.
# Update them with `pre-commit autoupdate --freeze`.

repos:
  # Secret detection runs first: a leaked key must never reach a commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"] # model and audio files belong outside Git
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # frozen: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
